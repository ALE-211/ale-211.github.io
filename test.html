<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RickC.TechBlog | 技术主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        textlight: '#cbd5e1'
                    },
                    fontFamily: {
                        mono: ['Consolas', 'Monaco', 'monospace']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .nav-link {
                @apply px-4 py-2 rounded-lg transition-all duration-300 hover:bg-primary/20 hover:text-primary;
            }
            .card-hover {
                @apply transition-all duration-300 hover:shadow-lg hover:shadow-primary/20 hover:-translate-y-1;
            }
            .active-nav {
                @apply bg-primary/20 text-primary;
            }
            .toc-active {
                @apply bg-primary/20 text-primary;
            }
        }
    </style>
</head>
<body class="bg-darkbg text-textlight min-h-screen font-mono transition-colors duration-300">
    <!-- 顶部快捷导航栏 -->
    <header class="sticky top-0 z-50 bg-cardbg border-b border-gray-700 shadow-md">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <!-- 网站Logo -->
            <a href="#" class="text-2xl font-bold text-primary flex items-center gap-2">
                <img src="https://ale-211.github.io/LOGO260721.png" alt="logo" class="h-8 w-auto">
                <span>RickC.TechBlog</span>
            </a>
            <!-- 导航栏向右移动 -->
            <nav class="hidden md:flex gap-2 ml-auto">
                <a href="#" class="nav-link active-nav">
                    <i class="fa fa-home mr-1"></i>主页
                </a>
                <a href="#dev" class="nav-link">
                    <i class="fa fa-cogs mr-1"></i>开发
                </a>
                <a href="#download" class="nav-link">
                    <i class="fa fa-download mr-1"></i>下载
                </a>
                <a href="#server" class="nav-link">
                    <i class="fa fa-server mr-1"></i>服务器
                </a>
            </nav>
            <!-- 移动端菜单按钮 -->
            <button id="menuBtn" class="md:hidden text-xl">
                <i class="fa fa-bars"></i>
            </button>
        </div>
        <!-- 移动端下拉菜单 -->
        <div id="mobileMenu" class="hidden md:hidden px-4 pb-3 space-y-2 border-t border-gray-700">
            <a href="#" class="nav-link block active-nav">
                <i class="fa fa-home mr-1"></i>主页
            </a>
            <a href="#dev" class="nav-link block">
                <i class="fa fa-cogs mr-1"></i>开发
            </a>
            <a href="#download" class="nav-link block">
                <i class="fa fa-download mr-1"></i>下载
            </a>
            <a href="#server" class="nav-link block">
                <i class="fa fa-server mr-1"></i>服务器
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 grid lg:grid-cols-4 gap-8 relative">
        <!-- 侧边栏 个人信息 -->
        <aside class="lg:col-span-1">
            <div class="bg-cardbg rounded-xl p-6 card-hover">
                <div class="w-24 h-24 mx-auto rounded-full bg-primary/30 flex items-center justify-center text-4xl text-primary mb-4">
                    <i class="fa fa-user"></i>
                </div>
                <h2 class="text-xl text-center font-bold text-white mb-2">RickC</h2>
                <p class="text-gray-400 text-sm text-center mb-4">后端/运维/全栈爱好者</p>
                <div class="flex justify-center gap-4 text-lg mb-6">
                    <a href="#" class="hover:text-primary transition-colors"><i class="fa fa-github"></i></a>
                    <a href="#" class="hover:text-primary transition-colors"><i class="fa fa-gitlab"></i></a>
                    <a href="#" class="hover:text-primary transition-colors"><i class="fa fa-envelope"></i></a>
                </div>
                <div class="space-y-2 text-sm">
                    <p><i class="fa fa-tag text-primary mr-2"></i>技术分享</p>
                    <p><i class="fa fa-wrench text-primary mr-2"></i>服务器搭建</p>
                    <p><i class="fa fa-file-archive-o text-primary mr-2"></i>工具资源下载</p>
                </div>
            </div>

            <!-- 栏目快速访问替换为【目录】 -->
            <div class="bg-cardbg rounded-xl p-6 mt-6 card-hover">
                <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                    <i class="fa fa-list-ul text-primary"></i>目录
                </h3>
                <ul id="leftTocList" class="space-y-2 text-sm">
                    <!-- JS自动填充目录 -->
                </ul>
            </div>
        </aside>

        <!-- 主内容区 -->
        <section class="lg:col-span-3 space-y-8">
            <!-- 文章正文写在这里，h2会被自动抓取生成侧边目录 -->
            <article class="bg-cardbg rounded-xl p-6">
                <h1 class="text-3xl font-bold text-white mb-6">文章标题</h1>

                <h2 id="section1" class="text-xl font-bold text-white mt-8 mb-3">章节一</h2>
                <p class="text-textlight">正文内容，测试段落。向下滚动，左侧目录会高亮当前章节。</p>

                <h2 id="section2" class="text-xl font-bold text-white mt-8 mb-3">章节二</h2>
                <p class="text-textlight">正文内容，测试段落。</p>

                <h2 id="section3" class="text-xl font-bold text-white mt-8 mb-3">章节三</h2>
                <p class="text-textlight">正文内容，测试段落。</p>

                <h2 id="section4" class="text-xl font-bold text-white mt-8 mb-3">章节四</h2>
                <p class="text-textlight">正文内容，测试段落。</p>
            </article>
        </section>
    </main>

    <!-- 回到顶部按钮 -->
    <button id="backTopBtn" class="fixed bottom-6 right-6 w-11 h-11 rounded-full bg-primary text-white shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 hover:bg-blue-600">
        <i class="fa fa-arrow-up"></i>
    </button>

    <!-- 页脚 -->
    <footer class="bg-cardbg border-t border-gray-700 mt-12 py-6 text-center text-gray-500 text-sm">
        <p>© 2026 RickC.TechBlog 个人博客 | 所有资源仅供学习交流</p>
    </footer>

<script>
// ========= 移动端菜单 =========
const menuBtn = document.getElementById('menuBtn');
const mobileMenu = document.getElementById('mobileMenu');
menuBtn.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
});
mobileMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
        mobileMenu.classList.add('hidden');
    })
})

// ========= 回到顶部 =========
const backTopBtn = document.getElementById('backTopBtn');
window.addEventListener('scroll', () => {
    if(window.scrollY > 350){
        backTopBtn.classList.remove('opacity-0','pointer-events-none');
        backTopBtn.classList.add('opacity-100','pointer-events-auto');
    }else{
        backTopBtn.classList.add('opacity-0','pointer-events-none');
        backTopBtn.classList.remove('opacity-100','pointer-events-auto');
    }
})
backTopBtn.addEventListener('click', ()=>{
    window.scrollTo({top:0, behavior:'smooth'})
})

// ========= 左侧侧边栏生成目录 + 滚动高亮 =========
const leftTocList = document.getElementById('leftTocList');
const headings = Array.from(document.querySelectorAll('h2[id]'));

// 生成目录
headings.forEach(h => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = `#${h.id}`;
    a.textContent = h.innerText;
    a.className = "block px-2 py-1 rounded hover:bg-gray-700 transition-colors text-textlight";
    li.appendChild(a);
    leftTocList.appendChild(li);
})

// 滚动观察高亮
const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry => {
        const id = entry.target.id;
        const link = leftTocList.querySelector(`a[href="#${id}"]`);
        if(entry.isIntersecting){
            leftTocList.querySelectorAll('a').forEach(el=>el.classList.remove('toc-active'));
            link?.classList.add('toc-active');
        }
    })
},{rootMargin:"-15% 0px -65% 0px"})
headings.forEach(h=>observer.observe(h));
</script>
</body>
</html>
