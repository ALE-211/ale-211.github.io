<script>
/* TASK-085：404 页最近文章（镜像无 PHP，读静态 JSON；主站生成脚本 backup/gen_404_recent.php） */
fetch('/404-recent.json', {cache: 'no-store'}).then(function (r) { return r.json(); }).then(function (list) {
    var ul = document.getElementById('rk404Recent');
    if (!ul) { return; }
    if (!list || !list.length) { ul.innerHTML = '<li class="rk-404-empty">暂无内容</li>'; return; }
    ul.innerHTML = '';
    list.forEach(function (it) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = it.url; a.textContent = it.title; a.title = it.title;
        li.appendChild(a); ul.appendChild(li);
    });
}).catch(function () {});
</script>
<script>
const filterElem = document.querySelector('feGaussianBlur')
const clearFilter = () => {
const value = parseFloat(filterElem.getAttribute('stdDeviation').split(' ')[1]) - 0.06
if (value > 0) {
filterElem.setAttribute('stdDeviation', `0 ${value}`)
requestAnimationFrame(clearFilter)
} else {
return
}
}
setTimeout(clearFilter, 300)
</script>
